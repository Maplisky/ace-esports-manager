# 《VCT冠军经理》Android 出包（M4）：
# 手动触发（workflow_dispatch）或正式发版（release published）。
# 链路与本地 m4a 验证一致：JDK 22 + dotnet 8 + Godot 4.7.2 mono（Linux）+ mono 导出模板
# → GODOT_ANDROID_KEYSTORE_RELEASE_* 环境变量注入签名 → headless export-release → apksigner 验签
# → artifact 上传；发版触发时附加 APK 到 GitHub Release。
#
# 需要的 repo secrets：
#   KAIRO_KEYSTORE_B64      —— vctchamp-release.keystore 的 base64（certutil/base64 生成）
#   KAIRO_KEYSTORE_PASSWORD —— keystore 密码
name: kairo-android-build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable
  PROJECT_PATH: kairo
  KEYSTORE_USER: vctchamp

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Godot 4.7.2 mono + export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot-bin"
          GODOT_BIN="$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          chmod +x "$GODOT_BIN"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP/tpl/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.mono"
          "$GODOT_BIN" --version
        working-directory: ${{ runner.temp }}

      - name: Restore keystore from secret
        run: |
          set -e
          echo "${{ secrets.KAIRO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/vctchamp-release.keystore"
          test -s "$RUNNER_TEMP/vctchamp-release.keystore"

      - name: Build C# assembly
        run: dotnet build kairo.csproj -c Release --nologo
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Install Android build template (gradle)
        run: |
          set -e
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.mono"
          mkdir -p android/build
          unzip -q -o "$TPL/android_source.zip" -d android/build
          # .build_version 用点分版本（tag 连字符转点：4.7.2-stable → 4.7.2.stable.mono）
          printf '%s' "${GODOT_VERSION//-/.}.mono" > android/.build_version
          test -f android/build/build.gradle
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Export signed APK
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/vctchamp-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KAIRO_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p builds
          APK="builds/vct-champion-manager-${{ github.ref_name }}.apk"
          GODOT_BIN="${{ runner.temp }}/godot-bin/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          "$GODOT_BIN" --headless --path . --export-release "Android" "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify signature (apksigner)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools"/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vct-champion-manager-apk
          path: ${{ env.PROJECT_PATH }}/${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.PROJECT_PATH }}/${{ env.APK_PATH }}" --clobber --repo "$GITHUB_REPOSITORY"
